      </span>
      <button class="theme-toggle grid h-9 w-9 place-items-center rounded-full border border-[var(--line)]" aria-label="Toggle theme" type="button">
        <svg class="icon-sun" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v2"/><path d="M12 19v2"/><path d="M3 12h2"/><path d="M19 12h2"/><path d="M5.6 5.6 7 7"/><path d="M17 17l1.4 1.4"/><path d="M18.4 5.6 17 7"/><path d="M7 17l-1.4 1.4"/><path d="M12 17a5 5 0 1 0 0-10 5 5 0 0 0 0 10z"/></svg>

<main class="main mx-auto max-w-[940px] px-8 pb-16 pt-12 page">

  <header class="text-center">
    <div class="ai-orb mx-auto h-11 w-11 rounded-full"></div>
    <h1 class="display mt-6 text-[54px] leading-none">Ask about your time.</h1>
    <p class="mt-4 text-[16px] text-[var(--muted)]">Your activity is already here. Ask anything about it.</p>
  </header>

  <form id="askForm" class="ask-input mt-11 flex items-center gap-3 rounded-[22px] p-3">
    <input id="askInput" aria-label="Ask about your activity" value="Why was I less productive yesterday?" class="min-w-0 flex-1 bg-transparent px-3 py-3 text-[16px] outline-none" />
    <button class="grid h-11 w-11 place-items-center rounded-xl bg-[var(--ink)] text-[var(--paper)]" aria-label="Ask AI" type="submit">
      <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 2 11 13"/><path d="M22 2l-7 20-4-9-9-4z"/></svg>
    </button>
  </form>

  <div class="mt-5 flex flex-wrap justify-center gap-2">
    <button type="button" data-prompt="Why did I waste so much time yesterday?" class="rounded-full border border-[var(--line)] px-3 py-2 text-xs text-[var(--muted)] transition hover:bg-[var(--faint)]">Why did I waste so much time yesterday?</button>
    <button type="button" data-prompt="What distracted me most in the last 48 hours?" class="rounded-full border border-[var(--line)] px-3 py-2 text-xs text-[var(--muted)] transition hover:bg-[var(--faint)]">What distracted me most in the last 48 hours?</button>
    <button type="button" data-prompt="When am I usually most productive?" class="rounded-full border border-[var(--line)] px-3 py-2 text-xs text-[var(--muted)] transition hover:bg-[var(--faint)]">When am I usually most productive?</button>
    <button type="button" data-prompt="Compare today with yesterday." class="rounded-full border border-[var(--line)] px-3 py-2 text-xs text-[var(--muted)] transition hover:bg-[var(--faint)]">Compare today with yesterday.</button>
    <button type="button" data-prompt="How much time did I spend learning this week?" class="rounded-full border border-[var(--line)] px-3 py-2 text-xs text-[var(--muted)] transition hover:bg-[var(--faint)]">How much time did I spend learning this week?</button>
    <button type="button" data-prompt="What changed compared with last week?" class="rounded-full border border-[var(--line)] px-3 py-2 text-xs text-[var(--muted)] transition hover:bg-[var(--faint)]">What changed compared with last week?</button>
  </div>

  <section id="askLoading" hidden class="mt-10 flex items-center justify-center gap-3 rounded-[20px] bg-[var(--faint)] p-8 text-sm text-[var(--muted)]" aria-live="polite">
    <span class="pulse h-2.5 w-2.5 rounded-full bg-[var(--lime-deep)]"></span>Looking across your relevant activity…
  </section>

  <section id="askResult" hidden class="mt-10 overflow-hidden rounded-[26px] border border-[var(--line)]">
    <div class="border-b border-[var(--line)] bg-[var(--faint)] px-7 py-5">
      <p class="text-xs font-semibold text-[var(--muted)]">YOUR QUESTION</p>
      <p id="askQuestionEcho" class="mt-2 font-semibold"></p>
    </div>
    <div class="p-7 sm:p-9">
      <div class="flex items-center gap-2 text-xs font-semibold text-[var(--muted)]">
        <span class="ai-orb h-6 w-6 rounded-full"></span>ANALYSIS
      </div>
      <p id="askAnswerText" class="display mt-6 text-[28px] leading-[1.16] sm:text-[34px]"></p>
      <div class="mt-9 border-t border-[var(--line)] pt-5">
        <p class="text-xs font-semibold text-[var(--muted)]">SUPPORTING ACTIVITY</p>
        <div id="askEvidence" class="mt-3 grid gap-2"></div>
      </div>
    </div>
  </section>

</main>

<script src="assets/api.js"></script>
<script src="assets/script.js" defer></script>
<script src="assets/pages.js" defer></script>
</body>
</html>
