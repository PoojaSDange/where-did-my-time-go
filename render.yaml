# Hosted DEMO only (synthetic data). Real use is local-first: see README.
services:
  - type: web
    name: where-did-my-time-go-demo
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && python -m uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: APP_MODE
        value: demo
      - key: DB_PATH
        value: /tmp/wdmt-demo.sqlite3
      - key: DATA_DIR
        value: /tmp/wdmt-demo
      - key: GROQ_API_KEY
        sync: false